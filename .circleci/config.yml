# Generated by the DevOps agent. Template: npm
version: 2.1

jobs:
  test:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-{{ checksum "package-lock.json" }}
      - run: npm ci
      - save_cache:
          key: npm-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run: npm test

  build-and-push:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Log in to Docker Hub
          command: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - run:
          name: Build image
          command: docker build -f Dockerfile -t "$DOCKERHUB_USERNAME/dockertest3:$CIRCLE_SHA1" -t "$DOCKERHUB_USERNAME/dockertest3:latest" .
      - run:
          name: Push image
          command: |
            docker push "$DOCKERHUB_USERNAME/dockertest3:$CIRCLE_SHA1"
            docker push "$DOCKERHUB_USERNAME/dockertest3:latest"

workflows:
  Agent-Test3:
    jobs:
      - test
      - build-and-push:
          requires:
            - test
          filters:
            branches:
              only: "circleci-project-setup"
